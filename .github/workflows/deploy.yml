name: deploy

# One production release per commit: stage the web build on Vercel, deploy the backend over
# SSM, check readiness, then promote the staged web build. Runbook: docs/DEPLOY.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to release
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.main.outputs.current }}
    steps:
      # A slow or rerun CI must not roll production back to an older commit.
      - id: main
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo current=true >> "$GITHUB_OUTPUT"; exit 0; fi
          latest=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          [ "$latest" = "$SHA" ] && echo current=true >> "$GITHUB_OUTPUT" || echo "Superseded by $latest"

  release:
    needs: check
    if: needs.check.outputs.current == 'true'
    runs-on: ubuntu-24.04
    environment: production
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
      VERCEL: npx --yes vercel@48.9.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      INSTANCE: ${{ vars.DEPLOY_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: Stage web build (not live)
        run: |
          $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN"
          $VERCEL build --prod --token="$VERCEL_TOKEN"
          url=$($VERCEL deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "WEB_URL=$url" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy backend
        run: |
          cmd="runuser -l ubuntu -c 'set -e; cd ~/jobatlas; git fetch -q origin; git checkout -q --detach $SHA; docker compose --env-file ~/deploy/.env -f infra/compose.prod.yaml up -d --build --remove-orphans'"
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --parameters "$(jq -nc --arg c "$cmd" '{commands: [$c], executionTimeout: ["3600"]}')" \
            --query Command.CommandId --output text)
          while sleep 10; do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ]

      - name: Backend readiness
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.API_URL }}/api/v2/health/ready"

      - name: Promote web build
        run: $VERCEL promote "$WEB_URL" --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
