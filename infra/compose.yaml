name: jobatlas

x-backend: &backend
  build:
    context: ../backend
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://jobatlas:jobatlas@db:5432/jobatlas
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: jobatlas
      POSTGRES_PASSWORD: jobatlas
      POSTGRES_DB: jobatlas
    ports:
      - "${JOBATLAS_DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobatlas -d jobatlas"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    ports:
      - "${JOBATLAS_REDIS_PORT:-63799}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    # Then group any city without a region (first deploy, new catalogue entries): the API
    # starts only after this, and its readiness requires every city to have a group. Last,
    # store the current Job Bank release's missing history overviews (normally none).
    command: ["sh", "-c", "alembic upgrade head && jobatlas atlas-groups --if-needed && jobatlas atlas-overviews"]
    restart: "no"
  api:
    <<: *backend
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${JOBATLAS_API_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--pool=prefork", "--concurrency=1", "-Q", "atlas", "-n", "atlas@%h"]
    mem_limit: 768m
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010}
    ports:
      - "${JOBATLAS_WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  pgdata:
